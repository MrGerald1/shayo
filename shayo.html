*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);
  font-family:Archivo,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--yellow);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* FEED: one roast fills the screen. Swipe up for the next. */
.feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.shot{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.shot.tone{display:flex;align-items:center;justify-content:center;padding:12% 8% 34%}
.shot.tone b{font-weight:900;letter-spacing:-.055em;line-height:.82;opacity:.15;text-transform:uppercase;
  transform:rotate(-6deg);text-align:center;max-width:100%}
.veil{position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(22,18,15,.62) 0%,rgba(22,18,15,.18) 26%,rgba(22,18,15,.55) 52%,rgba(22,18,15,.93) 82%,rgba(22,18,15,.97) 100%)}
.slidebody{position:relative;z-index:2;padding:0 var(--m) calc(112px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:13px;min-height:52dvh;justify-content:flex-end}
.cat{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;font-size:11px;
  font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.cat i{width:6px;height:6px;border-radius:99px;background:var(--yellow)}
.dname{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.75;margin:0}
.roast{font-size:clamp(21px,5.6vw,26px);line-height:1.28;font-weight:600;margin:0;white-space:pre-line;
  text-wrap:pretty;max-width:22ch}
.slideact{display:flex;gap:10px;align-items:center;margin-top:4px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:99px;
  background:var(--scrim-1);font-size:15px;font-weight:700}
.act.on{background:var(--yellow);color:var(--ink)}
.act.share{background:var(--paper);color:var(--ink)}
.act svg{width:18px;height:18px}
.more{align-self:flex-start;font-size:14px;font-weight:600;opacity:.82;text-decoration:underline;
  text-underline-offset:4px;min-height:48px;display:flex;align-items:center;text-align:left}
.safety{font-size:12px;font-weight:600;opacity:.62;margin:2px 0 0;letter-spacing:.01em}

.topbar{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) var(--m) 10px;
  background:linear-gradient(180deg,rgba(22,18,15,.62),transparent)}
.brand{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:900;letter-spacing:-.045em;min-height:48px}
.brand svg{width:22px;height:22px}
.iconbtn{width:48px;height:48px;border-radius:99px;display:grid;place-items:center;background:var(--scrim-1)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.solid{background:var(--card);color:var(--ink)}

/* bottom: one primary job, on every screen. "Who you wan roast?" */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
  z-index:7;display:flex;gap:8px;width:min(420px,calc(100vw - 32px))}
.dock .primary{flex:1;min-height:54px;border-radius:99px;background:var(--yellow);color:var(--ink);
  font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px}
.dock .primary svg{width:19px;height:19px}
.dock .square{width:54px;height:54px;border-radius:99px;background:var(--scrim-2);display:grid;place-items:center}
.dock .square svg{width:21px;height:21px}
.dock.onlight .square{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(22,18,15,.1)}
.topacts{display:flex;gap:8px}

.coach{position:fixed;inset:0;z-index:9;background:rgba(22,18,15,.72);display:grid;place-items:center;
  text-align:center;padding:40px}
.coach div{max-width:22ch}
.coach b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.coach p{font-size:16px;line-height:1.45;opacity:.82;margin:0 0 26px}
.thumb{width:44px;height:64px;margin:0 auto 22px;border-radius:99px;border:2px solid var(--yellow);
  position:relative;overflow:hidden}
.thumb i{position:absolute;left:50%;bottom:8px;width:10px;height:10px;margin-left:-5px;border-radius:99px;
  background:var(--yellow);animation:swipe 1.5s ease-in-out infinite}
@keyframes swipe{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-38px);opacity:0}}

/* light screens */
.light{background:var(--paper);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch}
.light::before{content:"";position:fixed;inset:0;background-image:var(--crate);
  background-size:320px 320px;opacity:.08;pointer-events:none;z-index:0}
.pad{padding:calc(12px + env(safe-area-inset-top)) var(--m) calc(104px + env(safe-area-inset-bottom));
  max-width:460px;margin:0 auto;width:100%;position:relative;z-index:1}
.head{display:flex;align-items:center;gap:12px;min-height:56px;margin-bottom:8px}
.head .iconbtn{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(22,18,15,.08)}
.head h1,.head h2,.head .htitle{flex:1;font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-size:31px;line-height:33px;font-weight:800;letter-spacing:-.03em;margin:0 0 10px}
.lede{font-size:15.5px;line-height:23px;color:var(--muted);margin:0 0 22px;max-width:34ch}
.search{display:flex;align-items:center;gap:11px;height:56px;border-radius:99px;background:var(--card);
  padding:0 18px;box-shadow:0 1px 2px rgba(22,18,15,.08);margin-bottom:14px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px;height:100%;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 calc(var(--m)*-1) 12px;padding:2px var(--m) 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:48px;padding:0 16px;border-radius:99px;background:var(--card);font-size:14px;
  font-weight:600;box-shadow:0 1px 2px rgba(22,18,15,.06);display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--ink);color:var(--paper)}
.filters{margin:0 0 6px}
/* The label sat beside the row in a 58px box and "Strength" needed 75px, so it
   clipped. Above the row it cannot. */
.frow>b{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:2px 0 6px}
.fbtn{margin-bottom:12px}
.fbtn .n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;
  border-radius:99px;background:var(--yellow);color:var(--ink);font-size:12px;font-weight:800}
.chip.on .n{background:var(--yellow);color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.count button{font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:48px;color:var(--ink)}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* DESIGN.md: two up under 600px, three up above. */
@media (min-width:600px){.pgrid{grid-template-columns:1fr 1fr 1fr}}
.pcard{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;display:flex;
  align-items:flex-end;text-align:left;color:var(--paper)}
.pcard .shot{position:absolute;inset:0}
.pcard .shot.tone{padding:14% 10% 30%}
.pcard .shot.tone b{opacity:.17}
.pcard .veil{background:linear-gradient(180deg,rgba(22,18,15,.05) 40%,rgba(22,18,15,.86) 100%)}
.pcard span{position:relative;z-index:2;padding:12px}
.pcard b{display:block;font-size:15px;font-weight:800;line-height:1.15}
.pcard em{display:block;font-style:normal;font-size:12.5px;font-weight:600;opacity:.8;margin-top:2px}

.hero{position:relative;height:38dvh;min-height:280px;border-radius:0 0 26px 26px;overflow:hidden;
  display:flex;align-items:flex-end;margin:0 calc(var(--m)*-1) 18px}
.hero .veil{background:linear-gradient(180deg,rgba(22,18,15,.5) 0%,rgba(22,18,15,.1) 40%,rgba(22,18,15,.9) 100%)}
.hero span{position:relative;z-index:2;padding:20px;color:var(--paper)}
.hero h1{margin:0;font-size:34px;line-height:35px}
.hero em{font-style:normal;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.block{background:var(--card);border-radius:var(--r);padding:2px 18px;margin-top:14px;
  box-shadow:0 1px 2px rgba(22,18,15,.07)}
.block section{padding:16px 0}
.block section+section{border-top:1px solid var(--hair)}
.block h3,.block .h3{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.block p{margin:0;font-size:15.5px;line-height:23px}
.quote{font-size:19px;line-height:27px;font-weight:600;white-space:pre-line}
.scale{margin-top:14px}
.bar{display:flex;gap:5px}
.bar i{flex:1;height:8px;border-radius:99px;background:var(--hair)}

.legend{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:12.5px;

.v-n{background:var(--red);color:var(--paper)}

.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shelf{display:flex;gap:10px;overflow-x:auto;margin:0 calc(var(--m)*-1);padding:4px var(--m) 10px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf .pcard{flex:none;width:130px;aspect-ratio:3/4.2}

  line-height:20px;color:var(--muted)}

/* the status card. Same anatomy on screen and in the 1080x1920 export. */
.statuswrap{position:relative;border-radius:var(--rs);overflow:hidden;aspect-ratio:1080/1920;

  padding:9% 8%;color:var(--sink,var(--paper));text-align:left}
/* 24 of the 73 drink colours are too light for paper type. The card picks whichever
   of paper or ink actually contrasts, and the pattern, ticks and mark follow it. */
.statuswrap.inked{--sink:var(--ink)}
.statuswrap .crate{position:absolute;inset:0;background-image:var(--crate);background-size:320px 320px;
  opacity:.2;filter:invert(1);pointer-events:none}

.statuswrap>*{position:relative;z-index:1}
.ticks{display:flex;gap:7px;margin-bottom:7%}
.ticks i{width:30px;height:6px;border-radius:99px;overflow:hidden;position:relative}
.ticks i::before{content:"";position:absolute;inset:0;border-radius:99px;background:currentColor;opacity:.34}
.ticks i.on::after{content:"";position:absolute;inset:0;background:currentColor;transform-origin:left;
  animation:tick var(--tick,8s) linear forwards}
@keyframes tick{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stitle{font-size:clamp(22px,6vw,30px);line-height:.94;font-weight:900;letter-spacing:-.04em;
  text-transform:uppercase;margin:0 0 5%}
.stext{font-size:clamp(13px,3.4vw,16px);line-height:1.3;font-weight:800;margin:0;white-space:pre-line}
.sfoot{display:flex;align-items:center;gap:7px;margin-top:7%;font-size:12px;font-weight:800;letter-spacing:.02em}
.sfoot svg{width:15px;height:15px;flex:none}
.cardcap{text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 0}
.venuebtn{display:block;width:100%;text-align:left;min-height:48px;padding:0 18px;border-radius:99px;
  background:var(--card);box-shadow:0 1px 2px rgba(22,18,15,.07);font-size:14px;font-weight:600;
  color:var(--muted);margin-bottom:10px}

.ask{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r);
  padding:15px 17px;min-height:56px;box-shadow:0 1px 2px rgba(22,18,15,.08)}

.opt em{display:block;font-style:normal;font-size:13.5px;color:var(--muted);margin-top:2px}

.gate{position:absolute;inset:0;background:var(--ink);z-index:10;display:flex;flex-direction:column;

.gate h1{font-size:38px;line-height:39px;letter-spacing:-.035em;margin-bottom:12px}
.gate p{font-size:16px;line-height:24px;opacity:.78;margin:0 0 22px;max-width:30ch}
.gate .btn.quiet{background:var(--scrim-1);color:var(--paper);box-shadow:none}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  z-index:12;background:var(--paper);color:var(--ink);padding:12px 18px;border-radius:99px;font-size:14px;
  font-weight:700;box-shadow:0 8px 24px rgba(22,18,15,.3);opacity:0;pointer-events:none;transition:opacity .18s;
  max-width:calc(100vw - 40px);text-align:center}
#toast.on{opacity:1}
#toast.bad{background:var(--red);color:var(--paper)}
#sheet{position:fixed;inset:0;z-index:14}
.scrim{position:absolute;inset:0;background:rgba(22,18,15,.6);width:100%}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;background:var(--paper);

.sheet img{display:block;width:66%;margin:14px auto;border-radius:16px}

/* an unset LIVE_URL is silent in production and loud here */
.devwarn{position:fixed;left:0;right:0;top:0;z-index:20;background:var(--red);color:var(--paper);
  font-size:12px;font-weight:700;padding:7px 14px;text-align:center;line-height:1.35}


/* ── ACT TWO ─────────────────────────────────────────────────────────────── */

/* the running total. Display weight, tabular figures, naira always, never
   abbreviated, and it never changes colour. */
.total{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r);
  padding:18px;box-shadow:0 1px 2px rgba(22,18,15,.07);margin-bottom:10px}
.total b{display:block;font-size:42px;line-height:1;font-weight:900;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.total em{display:block;font-style:normal;font-size:13px;font-weight:600;color:var(--muted);margin-top:7px}
.totalhint{display:inline-block;margin-top:9px;font-size:13px;font-weight:700;
  text-decoration:underline;text-underline-offset:3px}
.big{font-size:38px;line-height:1.05;font-weight:900;letter-spacing:-.035em;margin:0 0 8px;
  font-variant-numeric:tabular-nums}
.note{font-size:13px;line-height:19px;color:var(--muted);margin:10px 0 0;display:flex;
  align-items:center;gap:6px;flex-wrap:wrap}
.note .key{width:14px;height:14px;border-radius:4px;display:inline-block}

.items{background:var(--card);border-radius:var(--r);padding:4px 16px;margin-bottom:12px;

.item{display:flex;gap:12px;align-items:baseline;padding:11px 0;font-size:15px;
  font-variant-numeric:tabular-nums}
.item+.item{border-top:1px solid var(--hair)}
.item .t{flex:none;width:66px;color:var(--muted);font-size:13px;font-weight:600}
.item .nm{flex:1;font-weight:600}
.item .pr{flex:none;font-weight:800}
.item.dead{color:var(--muted)}
.item.dead .nm{text-decoration:line-through}

/* the six tiles. 1:1, two up under 600px, three up above, minimum edge 140px,
   because the target is a thumb belonging to someone who has been drinking. */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(140px,1fr));gap:12px;margin:10px 0 4px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,minmax(140px,1fr))}}
.tile{position:relative;aspect-ratio:1;border-radius:var(--r);display:flex;align-items:flex-end;

.tile.more6{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(22,18,15,.08);

.tile.more6 svg{width:22px;height:22px;color:var(--muted)}
.tile:active{transform:scale(.985)}

/* Settle. A paper till receipt, read at arm's length in bad light by a hostile
   second party, so nothing here is smaller than 17px. */
.receipt{background:#fff;border-radius:6px;padding:22px 18px;box-shadow:0 2px 10px rgba(22,18,15,.13);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--ink);font-size:17px;line-height:1.5}
.rhead{text-align:center;margin-bottom:12px}

.rhead span{display:block;font-size:15px;color:#4a443f}
.rule{border-top:1.5px dashed #9a938c;margin:10px 0}
.rrow{display:flex;gap:10px;align-items:baseline;padding:3px 0;font-variant-numeric:tabular-nums}
.rrow .t{flex:none;width:74px;color:#4a443f;font-size:15px;text-align:right}
.rrow .nm{flex:1}
.rrow .pr{flex:none;font-weight:600;text-align:right;min-width:62px}
.rrow .rm{flex:none;width:100%;text-align:right;font-size:13px;color:#8a1418;margin-top:-4px}
.rrow.dead{color:#8a1418}
.rrow.dead .nm{text-decoration:line-through}
.rrow.rtot{font-weight:700;font-size:19px}
.rfoot{text-align:center;font-size:14px;color:#4a443f;letter-spacing:.06em}

/* the ledger. A grid is read for pattern, not for score, so no cell is ever
   coloured as failure and nothing accumulates. */
/* Seven 48px cells plus gaps do not fit inside a 20px page margin on a 390px
   phone, so the grid bleeds to 8px from the screen edge and the cells clear 48. */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
  margin:16px calc(8px - var(--m)) 4px}
.caph{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cell{aspect-ratio:1;min-width:48px;border-radius:8px;background:var(--card);box-shadow:inset 0 0 0 1px var(--hair);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);
  min-height:48px;padding:0}
.cell.l1{background:#E8E2CE;color:var(--ink)}
.cell.l2{background:#DCCFA2;color:var(--ink)}
.cell.l3{background:#CBB26A;color:var(--ink)}
.cell.l4{background:#B2903A;color:var(--paper)}
/* A dry night must not read as a cheap night. Spend is the warm ramp; a marked
   night is a different hue with a ring, so the grid is readable at a glance and
   still colours nothing as failure. */
.cell.dry{background:var(--blue-mist);color:var(--blue);box-shadow:inset 0 0 0 2.5px var(--blue)}
.cell.today{outline:2.5px solid var(--yellow);outline-offset:1px}
.cell:disabled{opacity:.34;box-shadow:none;cursor:default}
.key.l2{background:#DCCFA2}
.key.dry{background:var(--blue-mist);box-shadow:inset 0 0 0 2px var(--blue)}

/* the number pad. One price per drink per night, then every tap is one tap. */
.pad9{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.key9{min-height:60px;border-radius:16px;background:var(--card);font-size:22px;font-weight:800;
  box-shadow:0 1px 2px rgba(22,18,15,.08);display:grid;place-items:center}
.key9.go{background:var(--yellow)}
.key9.go svg{width:24px;height:24px}
#padval{margin:6px 0 0}

@media (min-width:820px){
  .wide .tiles{grid-template-columns:repeat(3,minmax(140px,1fr))}
}

/* responsive. Phone is the design; desktop is a real layout, not a stretch. */
@media (min-width:820px){
  body{background:#0E0B09}
  .screen:not(.wide){left:50%;transform:translateX(-50%);width:430px;right:auto;

  .topbar{left:50%;transform:translateX(-50%);width:430px;right:auto}
  .dock{width:390px}
  /* the shared-card route is the one desktop-native screen: somebody clicked a WhatsApp link */
  .wide{overflow-y:auto}
  .wide .pad{max-width:1040px;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);
    gap:52px;align-items:start;padding-top:44px}
  .wide .head,.wide .foot{grid-column:1/-1}
  .wide .hero{margin:0;border-radius:var(--r);height:auto;aspect-ratio:3/4;min-height:0}
  .wide .statuswrap{max-width:360px}
  .wide .block{margin-top:0}
  .wide .col2{grid-column:2;margin-top:0}
  .screen:not(.wide) .pgrid{grid-template-columns:1fr 1fr}
  /* the shelf bleeds to the screen edge on a phone; inside a column it should not */
  .wide .shelf{margin:0;padding-left:0;padding-right:0}
}
@media (prefers-reduced-motion:reduce){
  .thumb i{animation:none}
  .ticks i.on::after{animation:none;transform:scaleX(1)}
}

  fix:"Over ice with lime. It finally becomes the drink it's been pretending to be."},
 {id:"remy",name:"Remy Martin",cat:"Cognac",type:"Hennessy with an accent",color:"#5E7183",s:4,p:3,ven:"ldmo",t:["smooth"],v:"nsggg",m:["Remy Martins","Remy Martin","Remy"],
  roast:"Remy Martins is the Quiet sibling of Henessey..\nthey both face the same problems and almost same components.\n\nOnly that Remy Drinkers are a little more introverted and like to feel like they are mature.\n\nBasically, Remy is Hennessy with an accent.",
  who:"People that read the label out loud and pronounce it properly.",
  fix:"Neat, one cube of ice, and a conversation you actually want to have."},
 {id:"bullet",name:"Bullet",cat:"Ready to drink",type:"Small but deadly",color:"#7C8A1E",s:4,p:1,ven:"cr",t:["sweet"],v:"nnsbb",m:["Bullet"],
  roast:"BULLET.\nThat's the tweet.\n\nProceed with caution. How can something so small be so dangerous?!!!!!!!",
  who:"People that say \"I'm not even tired\" at 2am while very tired.",
  fix:"One can. Never with another drink. Tiny does not mean innocent."},
 {id:"radler",name:"Star Radler",cat:"Beer",type:"Peer pressure pikin",color:"#CF5E57",s:1,p:1,ven:"fdmbh",t:["sweet","fizzy"],v:"ggbbb",m:["Star Radler","Star raddler","raddler","radler"],
  roast:"Haha... STAR RADLER.\nThis is for toddlers whose mother was drinking alcohol in her third trimester and the baby got used to it..\n\nThose that drink star raddler are the perfect example of peer pressure. And I believe at every sip, they pray for God's forgiveness.\n\nBecause WTF?!!",
  who:"Peer pressure. In a bottle.",
  fix:"Just order Chapman. Same sweetness, more confidence."},
 {id:"martell",name:"Martell",cat:"Cognac",type:"Doesn't know why",color:"#A0651A",s:4,p:3,ven:"oumv",t:["smooth"],v:"nsggg",m:["Martell"],
  roast:"Martell.\nTheir brands are usually smooth and pretty good... but it does not have an identity.\n\nA Martell drinker will buy Martell and that's that. No one will go to buy another drink and end up with Martell.\n\nEven people that are drinking it don't know why they are.",
  who:"Loyal customers that have never explained the loyalty.",
  fix:"Give it an identity. Ginger ale, lemon, and a name you made up."},
 {id:"rum",name:"Dark rum",aka:"Dark Sailor, Captain Morgan",cat:"Rum",type:"Best friend's enemy",color:"#6B2E2E",s:4,p:1,ven:"crbh",t:["sweet"],v:"nnsgg",m:["Dark Sailor","Rum"],
  roast:"RUM.\nHmm. How many of you ever tasted \"Dark Sailor\"? Dark sailor will poison your mind against your best friend. All you want to do is fight or steal his girl. No matter how refined or distilled, Rum is the drink that will be served in Hell Fire.\n\nPerfect only for cocktails.",
  who:"Sailors, pirates, and your friend that is \"fine\" after the breakup.",
  fix:"Pineapple, lime and small nutmeg. Now it's a vacation, not a fight."},
 {id:"red_wine",name:"Red wine",cat:"Wine",type:"Fornicatory nerves",color:"#7A1F35",s:3,p:2,ven:"dmof",t:["smooth","sweet"],v:"sgggg",m:["Red Wine"],
  roast:"If we are about to get into a fight, offer me Red Wine first.\nIt goes straight to break ur joints, relax ur muscles and then activate ur fornicatory nerves",
  who:"People that say it goes well with suya. They're not wrong.",
  fix:"Offer it before the fight. Warm it with cloves and orange if it's harmattan."},
 {id:"legend",name:"Legend Extra Stout",cat:"Stout",type:"War front soldier",color:"#5F4636",s:4,p:1,ven:"jmuv",t:["bitter"],v:"nnsgg",m:["Legend Extra Stout","Legend"],
  roast:"When in doubt, order a beer.\nIn the 17th Century, when soldiers are about to go to the war front for really tough battles, they serve them with three drinks.\n\nLEGEND EXTRA STOUT: the 🔥 the bottle is a real ingredient.\n\nThe third drink? Nobody knows. Nobody came back to tell us.",
  who:"Men that don't talk much and have a favourite chair at the joint.",
  fix:"Pepper soup, and nobody asking you questions."},
 {id:"gulder",name:"Gulder",cat:"Beer",type:"Race horse",color:"#7F5F18",s:3,p:1,ven:"ojuvh",t:["bitter"],v:"nsggg",m:["Gulder","Guilder"],
  roast:"GULDER.\nMeant for race horses.\n\nThe bottle is big because it knows what it's about to do to you. Two bottles in, you are giving the barman marriage advice.",
  who:"Men that say \"let me see what this one is saying\" and then find out.",
  fix:"Eat first. Even race horses eat."},
 {id:"moscato",name:"White wine and Moscato",cat:"Wine",type:"Drunk drunk",color:"#A9791A",s:2,p:2,ven:"mdbf",t:["sweet"],v:"sgggg",m:["White wine","Moscatos","Moscato"],
  roast:"White wine is easily the most relaxing drink to have at home.\nFew rules around how to drink it. Hardly requires mixing.\n\nAnd the best kind of white wine will be the Moscatos..\n\nOnly problem is as long as it's cold, You will get carried away and next thing you are drunk drunk.",
  who:"People with a candle, a series and nowhere to be.",
  fix:"Frozen grapes instead of ice. It stays cold. You still have to count."},
 {id:"gin",name:"Gin",aka:"Gordon's, Bombay, Tanqueray",cat:"Gin",type:"OG or pretender",color:"#962556",s:4,p:2,ven:"mhldc",t:["bitter"],v:"nsggg",m:["Gin"],
  roast:"As For Gin.\nIt's largely drank by OGs or people who generally have no idea what to drink but want to be different.",
  who:"Read the roast again. There are only two types.",
  fix:"Zobo, cucumber and plenty ice. Now you're different on purpose."},
 {id:"schnapps",name:"Aromatic Schnapps",aka:"Seaman's",cat:"Local",type:"Drink for the ancestors",color:"#5F5450",s:5,p:2,ven:"ouv",t:["bitter"],v:"nnnsg",m:["Aromatic Schnapps","Schnapps"],
  roast:"Aromatic Schnapps.\nThere isn't much to write about it because I'm sure a good 60 - 70 percent of you have never tried it.\n\nBut me, I have.. a lot. 😁\n\nAnd I don't have much to say.. It's really a drink for the ancestors and if you touch it, anything you see, you take. Simple.",
  who:"Traditional rulers, in-laws at introductions, and the ancestors.",
  fix:"No fix. Some things are not for mixing. Pour small for the ones before you."},
 {id:"gnt",name:"Gin and tonic",cat:"Gin",type:"Sounds good, feels bad",color:"#34659C",s:3,p:2,ven:"ldfbm",t:["bitter","fizzy"],v:"ssggg",m:["Gin and Tonic"],
  roast:"\"Gin and Tonic\"\nit sounds good but doesn't feel good. It will allow you take as much as you want..\n\nOnce you drink some water, you are gone - for good.",
  who:"People that wanted to look sophisticated in the picture.",
  fix:"Drink the water anyway. That water story is a lie, we checked."},
 {id:"champagne",name:"Champagne",aka:"Moet, Veuve",cat:"Bubbles",type:"Point prover",color:"#8C6A1F",s:3,p:4,ven:"cldo",t:["fizzy"],v:"nsggg",m:["Champagne"],
  roast:"The main use of Champagne is to prove a point.\nThat's why you will never see anyone pour it into a flask and sip small small. It has to be in a flute and in public.\n\nAnd you will keep drinking so that more people will see you.. and when they are all gathered, you start vomiting.",
  who:"Birthday people, new promotions, and one guy that wants his ex to hear about it.",
  fix:"Small zobo syrup inside. It still proves the point, and tastes better doing it."},
 {id:"red_label",name:"JW Red Label",cat:"Whisky",type:"First aid box",color:"#8A3A1E",s:4,p:2,ven:"oujv",t:["bitter"],v:"nsgbb",m:["JW Red Label","Red Label"],
  roast:"JW Red Label used to be this popular.\nThese days it's usually in First Aid boxes for cleaning open injuries.. like TCP.\n\nIt will happen to Henny",
  who:"Party planners in 2009. Your uncle's cabinet today.",
  fix:"Mix it with Coke and nobody will ask. Drink it neat and everybody will."},

 {id:"heineken",name:"Heineken",cat:"Beer",type:"Cousin in London",color:"#2F6B3F",s:2,p:2,ven:"crlbhdfo",t:["fizzy","bitter"],v:"sgggg",m:["Heineken"],
  roast:"HEINEKEN.\nSame beer. Green bottle. Double price.\n\nPeople that drink Heineken in public want you to know they have a cousin in London. At home, they are drinking Star like everybody.",
  who:"Island people, and mainland people that want to be mistaken for island people.",
  fix:"Cold fridge, working NEPA. That's all it needs."},
 {id:"star",name:"Star Lager",cat:"Beer",type:"Family member",color:"#1F3B63",s:2,p:1,ven:"oujmvf",t:["bitter","fizzy"],v:"sgggg",m:["Star Lager","Star"],
  roast:"STAR.\nStar is not a beer, it's a family member. It has been at every naming ceremony, wedding and burial since before your father had teeth.\n\nNobody has ever been embarrassed holding a Star. Nobody has ever been impressed either.",
  who:"Uncles, landlords and anybody that starts a sentence with \"in our time\".",
  fix:"With pepper soup, while arguing about football."},
 {id:"trophy",name:"Trophy",cat:"Beer",type:"Plastic chair chairman",color:"#C2560F",s:2,p:1,ven:"jmhou",t:["bitter","fizzy"],v:"sgggg",m:["Trophy"],
  roast:"TROPHY.\nThe beer of men that have a plastic chair with their name on it at the joint.\n\nCheap, loyal and it has never asked you to prove anything. If Trophy was a person, it will lend you money and not tell anybody.",
  who:"Men watching Premier League at the joint with suya in one hand.",
  fix:"Suya. That's the fix."},
 {id:"goldberg",name:"Goldberg",cat:"Beer",type:"Fuji band loyalist",color:"#9A7420",s:2,p:1,ven:"oujm",t:["bitter","fizzy"],v:"sgggg",m:["Goldberg"],
  roast:"GOLDBERG.\nThis beer loves Yoruba parties more than Yoruba people. Once the fuji band starts, Goldberg opens itself.\n\nBy the 3rd bottle your agbada is heavy and you are spraying money you don't have.",
  who:"Men in agbada that start dancing before the band even plugs in.",
  fix:"Cold, with small chops, close to the band."},
 {id:"hero",name:"Hero",cat:"Beer",type:"My brother my brother",color:"#7A1F35",s:2,p:1,ven:"ojuvm",t:["bitter","fizzy"],v:"sgggg",m:["Hero"],
  roast:"HERO.\nThe only beer that asks where you're from before you open it.\n\nDrink Hero in Onitsha, nobody sees you. Drink Hero in Lekki, somebody will start speaking Igbo to you. Answer with your chest.",
  who:"Anybody that calls strangers \"my brother\" at the bar and means it.",
  fix:"Nkwobi on the side. Anything else is disrespect."},
 {id:"export33",name:"33 Export",cat:"Beer",type:"Work is finished",color:"#3E6B4F",s:2,p:1,ven:"jmuo",t:["bitter","fizzy"],v:"sgggg",m:["33 Export","33"],
  roast:"33 EXPORT.\nThe beer of men that have finished raising children and are now just waiting.\n\nNobody orders 33 to impress anybody. You order it because the work has been done and the evening finally belongs to you.",
  who:"Men that have paid every school fee they will ever pay.",
  fix:"Cold, in the evening, with nobody disturbing you."},
 {id:"life",name:"Life Continental",cat:"Beer",type:"Burial dancer",color:"#1E6B5A",s:2,p:1,ven:"ujov",t:["bitter","fizzy"],v:"sgggg",m:["Life Continental","Life"],
  roast:"LIFE.\nEastern beer with a marketing budget and a live band attached.\n\nEvery Life drinker has danced at somebody's burial like it was their own birthday. In the East that's not an insult. That's a compliment.",
  who:"People that travel 6 hours for a burial and arrive dancing.",
  fix:"Cold, at a burial, while the band is still strong."},
 {id:"tiger",name:"Tiger",cat:"Beer",type:"One extra bottle",color:"#2C4E6E",s:2,p:2,ven:"clhb",t:["fizzy","bitter"],v:"sgggg",m:["Tiger"],
  roast:"TIGER.\nFor guys that just discovered they can afford one extra bottle.\n\nIt's fine. It's cold. It has no personality and it is not trying to develop one.",
  who:"People still deciding what their drink is.",
  fix:"Cold, at the joint, while you decide who you really are."},
 {id:"flyingfish",name:"Flying Fish",cat:"Beer",type:"Beer in disguise",color:"#3E7E86",s:2,p:2,ven:"bhcld",t:["sweet","fizzy"],v:"ggbbb",m:["Flying Fish"],
  roast:"FLYING FISH.\nBeer with lemon inside, for people that want to drink without admitting they are drinking.\n\nYou are drinking beer. The lemon is not a costume. We can see you.",
  who:"People that say \"I'll just have something light\" every single time.",
  fix:"Very cold, at the beach. That's honestly where it makes sense."},
 {id:"budweiser",name:"Budweiser",cat:"Beer",type:"The club paid for it",color:"#B3263E",s:2,p:2,ven:"crlb",t:["fizzy"],v:"sggbb",m:["Budweiser"],
  roast:"BUDWEISER.\nThe beer that came to Nigeria and refused to adjust. It's in the club because the club was paid to put it there.\n\nNobody has ever gone home and said \"that Budweiser was sweet\". Not one person.",
  who:"People whose DJ said \"one more song\" four hours ago.",
  fix:"Ice bucket, club table. Just don't call it premium in front of us."},
 {id:"desperados",name:"Desperados",cat:"Beer",type:"Failed both exams",color:"#6F8430",s:3,p:2,ven:"crbh",t:["sweet","fizzy"],v:"nsgbb",m:["Desperados"],
  roast:"DESPERADOS.\nBeer that wanted to be tequila and failed both exams.\n\nIt drinks like Fanta and hits like a landlord in January. The name is not a brand, it's a description of the people drinking it.",
  who:"The friend that orders \"something different\" and regrets it by 1am.",
  fix:"One bottle, lime inside, then water."},
 {id:"guinness",name:"Guinness Stout",cat:"Stout",type:"Political analyst",color:"#3A302C",s:3,p:2,ven:"ojuvm",t:["bitter"],v:"nsggg",m:["Guinness"],
  roast:"GUINNESS.\nYour father said it gives strength. It doesn't. It gives confidence, which is worse.\n\nBy the 3rd bottle, every man at the table is a political analyst and a former footballer.",
  who:"Fathers, uncles and the cousin that just came back from gym.",
  fix:"Small blackcurrant and plenty ice. Your uncle will salute you."},
 {id:"turboking",name:"Turbo King",cat:"Stout",type:"The name is a warning",color:"#4A2E2A",s:4,p:1,ven:"jmuv",t:["sweet","bitter"],v:"nnsgg",m:["Turbo King","Turbo"],
  roast:"TURBO KING.\nDark, sweet and dangerous, like an aunty that gives you money and gossip at the same time.\n\nRead the name again. Turbo. King. Nobody named this one Small Gentle.",
  who:"Men that drink slowly and still finish before everybody.",
  fix:"One bottle, with food. Respect the name."},
 {id:"williams",name:"Williams Dark Ale",cat:"Stout",type:"Village meeting elder",color:"#4C3A2E",s:4,p:1,ven:"jvuo",t:["sweet","bitter"],v:"nnsgg",m:["Williams Dark Ale","Williams"],
  roast:"WILLIAMS.\nStout that went to a village meeting and came back speaking proverbs.\n\nFirst sip is sweet like malt. Then you stand up and the ground moves small. That's when you remember it's dark ale, not Malta.",
  who:"Elders that say \"my son\" before they insult you.",
  fix:"Slow sipping, plenty food, and don't stand up too fast."},
 {id:"action",name:"Action Bitters",cat:"Bitters",type:"Something must happen",color:"#6B3F2A",s:5,p:1,ven:"juom",t:["bitter"],v:"nnsgg",m:["Action Bitters","Action"],
  roast:"ACTION BITTERS.\nThe name is the instruction.\n\nNobody drinks Action Bitters to relax. You drink it because something must happen tonight and you have volunteered to be the one that starts it.",
  who:"The friend that says \"nothing spoil\" before everything spoils.",
  fix:"One shot. Then let somebody else start the action."},
 {id:"odogwu",name:"Odogwu Bitters",cat:"Bitters",type:"Self-appointed odogwu",color:"#5A3A5C",s:5,p:1,ven:"juovm",t:["bitter"],v:"nnsgg",m:["Odogwu Bitters","Odogwu"],
  roast:"ODOGWU BITTERS.\nEvery man that drinks this believes he is the odogwu. That's the whole marketing and it works perfectly.\n\nTwo shots and you'll be settling a dispute that nobody invited you to settle.",
  who:"Men that call themselves by their own nickname.",
  fix:"Small shot, cold, after food. The odogwu still needs to eat."},
 {id:"ruzu",name:"Ruzu Herbal Bitters",cat:"Bitters",type:"Blood circulation",color:"#4E5C38",s:5,p:1,ven:"jmv",t:["bitter"],v:"nnsgg",m:["Ruzu Herbal Bitters","Ruzu"],
  roast:"RUZU.\nThey wrote \"herbal\" on the label so your conscience can rest.\n\nUncles drink it for \"blood circulation\". The blood is circulating alright. Straight to the head. Very fast.",
  who:"Uncles with a bottle in the car door and a reason for it.",
  fix:"Tiny shot. Herbal is not the same thing as harmless."},
 {id:"hennessy",name:"Hennessy",cat:"Cognac",type:"Music video extra",color:"#9A5B12",s:4,p:3,ven:"colu",t:["smooth"],v:"nsggg",m:["Hennessy","Henessey","Henny"],
  roast:"HENNESSY.\nEverybody calls it Henny like it's their cousin. Henny has appeared in more music videos than half of the artists.\n\nRich people drink it. Broke people drink it louder.\n\nJW Red Label also thought it will last forever.",
  who:"Anybody that has said \"pop another one\" without checking the price.",
  fix:"Ginger ale and orange peel. Your wallet will thank you."},
 {id:"courvoisier",name:"Courvoisier",cat:"Cognac",type:"Proving range",color:"#8A5A3C",s:4,p:3,ven:"lodu",t:["smooth"],v:"nsggg",m:["Courvoisier"],
  roast:"COURVOISIER.\nFor people that got tired of the popular cognac and needed to prove they have range.\n\nIt's genuinely good. Nobody can pronounce it at the bar, so they just point at the bottle and nod.",
  who:"People that have graduated from Henny and want a certificate for it.",
  fix:"Neat, small glass, and practise the pronunciation at home first."},
 {id:"black_label",name:"JW Black Label",cat:"Whisky",type:"High table member",color:"#1F2A36",s:4,p:3,ven:"oulfv",t:["smooth"],v:"nsggg",m:["JW Black Label","Black Label"],
  roast:"BLACK LABEL.\nRed Label's elder brother that got a government job.\n\nAlways on the high table at the chief's party. You will never be invited to that table. You will just watch it from your plastic chair and pray.",
  who:"Chiefs, directors and people their age mates call \"sir\".",
  fix:"On the rocks with coconut water. Sounds wrong. Tastes like promotion."},
 {id:"chivas",name:"Chivas Regal",cat:"Whisky",type:"Contract signed",color:"#2F4A5C",s:4,p:3,ven:"flou",t:["smooth"],v:"nsggg",m:["Chivas Regal","Chivas"],
  roast:"CHIVAS.\nThe whisky your oga brings out when the contract has been signed.\n\nSmooth, expensive, and it always arrives with a small speech that nobody asked for.",
  who:"Men celebrating deals you were not part of.",
  fix:"Neat or one cube. And endure the speech, the drink is free."},
 {id:"single_malt",name:"Single malt",aka:"Glenfiddich, Singleton, Macallan",cat:"Whisky",type:"Notes of oak",color:"#6F5B2E",s:4,p:4,ven:"ldfmu",t:["smooth","bitter"],v:"nnsgg",m:["Single malt"],
  roast:"SINGLE MALT.\nThe drink of men that say \"notes of oak and honey\".\n\nOga, it's alcohol. You are tasting alcohol. Put Coke inside it and somebody's uncle will stand up and leave the party.",
  who:"Men with a whisky cabinet and a story for every bottle.",
  fix:"Few drops of water. No ice. No Coke. We beg."},
 {id:"jack",name:"Jack Daniel's",cat:"Whisky",type:"Leather jacket in Lagos",color:"#3B3B3B",s:4,p:3,ven:"clh",t:["sweet","smooth"],v:"nsggg",m:["Jack Daniel's","Jack"],
  roast:"JACK DANIEL'S.\nFor people that wear leather jacket in Lagos heat.\n\nTastes like America and a bad decision on a rooftop in VI. Every Jack drinker has a guitar at home they cannot play.",
  who:"Rock fans in a city of Afrobeats. Very brave people.",
  fix:"Coke and plenty ice. The ice is not optional in this weather."},
 {id:"ciroc",name:"Ciroc",cat:"Vodka",type:"Bottle service flex",color:"#2E5B8A",s:4,p:4,ven:"clr",t:["smooth"],v:"nnsgg",m:["Ciroc"],
  roast:"CIROC.\nVodka that went to a music video and refused to come back.\n\nYou are paying for the bottle and the celebrity that posted it once. Blindfold anybody drinking Ciroc and they will fail the test. Every single time.",
  who:"People whose table has a sparkler and a photographer on standby.",
  fix:"If you must, make it long. Soda, lime, plenty ice. Make the bottle last."},
 {id:"smirnoff_ice",name:"Smirnoff Ice",cat:"Ready to drink",type:"Texting your ex",color:"#5467B8",s:2,p:1,ven:"crbhd",t:["sweet","fizzy"],v:"ggbbb",m:["Smirnoff Ice","Smirnoff"],
  roast:"SMIRNOFF ICE.\nThe first alcohol everybody lies about. \"It's not even strong.\"\n\nTwo bottles later you're texting your ex \"u up?\" and blaming Smirnoff. It's sweet, it's fizzy and it will betray you like a church friend.",
  who:"First timers, and grown adults that still text their ex.",
  fix:"Keep the bottle in the fridge and your phone in your bag."},
 {id:"x1",name:"Smirnoff X1 Tamarind",cat:"Vodka",type:"I don't really drink",color:"#B5561B",s:4,p:1,ven:"crhoj",t:["sweet"],v:"nsgbb",m:["Smirnoff X1 Tamarind","X1 Tamarind","X1"],
  roast:"X1 TAMARIND.\nThe drink of people that say \"I don't really drink\" and then finish the bottle before the rice is served.\n\nThe tamarind is just there to distract you from what is happening.",
  who:"People that \"don't really drink\".",
  fix:"Soda water and plenty ice. It stretches the bottle and your night."},
 {id:"local_gin",name:"Local dry gin",aka:"Chelsea, Lord's, Seaman's",cat:"Gin",type:"Built this country",color:"#3F5E4A",s:5,p:1,ven:"vuoj",t:["bitter"],v:"nnsgg",m:["Local dry gin","Chelsea","Lord's"],
  roast:"LOCAL DRY GIN.\nThis bottle built Nigeria. Every community meeting, every kola, every land dispute, it is somewhere on that table.\n\nCheap, strong and honest about what it is. That's more than we can say for the sachet version.",
  who:"Elders settling matters that started before you were born.",
  fix:"Small glass, poured with respect, after the kola has been broken."},
 {id:"sachet_gin",name:"Sachet gin",cat:"Gin",type:"Mortgage consequences",color:"#4D4D4D",s:5,p:1,ven:"",t:["bitter"],v:"nnnnn",noPick:true,m:["Sachet gin"],
  roast:"SACHET GIN.\nPure water price. Mortgage consequences.\n\nThe label is lying. The alcohol percentage is lying. Even the person selling it is lying. Only the headache is honest.",
  who:"People that have made decisions. Many decisions.",
  fix:"No fix. We love you too much. Buy Chapman."},
 {id:"squadron",name:"Squadron Rum",cat:"Rum",type:"Military consequences",color:"#5C3A2A",s:5,p:1,ven:"jmv",t:["sweet","bitter"],v:"nnsgg",m:["Squadron Rum","Squadron"],
  roast:"SQUADRON.\nRum with a military name and military consequences.\n\nIt does not negotiate. One moment you are fine, next moment you are explaining your childhood to somebody you met 20 minutes ago.",
  who:"Men that drink standing up, near the door, for no reason.",
  fix:"Cut it with Coke and lime, or it will cut you."},
 {id:"premium_tequila",name:"Premium tequila",aka:"Don Julio, Casamigos, Clase Azul",cat:"Tequila",type:"Paid for the bottle",color:"#3F5A8A",s:4,p:4,ven:"cld",t:["smooth"],v:"nnsgg",m:["Premium tequila"],
  roast:"PREMIUM TEQUILA.\nYou paid for the bottle design and the celebrity that posted it once.\n\nInside, it's still tequila. Just with longer grammar when they are describing it to you.",
  who:"People whose table has sparklers and a photographer.",
  fix:"Sip it slowly with orange. If you paid that much, at least taste it."},
 {id:"shots",name:"Tequila shots",cat:"Tequila",type:"Last one, four times",color:"#C8412F",s:5,p:2,ven:"crh",t:["bitter"],v:"nnssb",m:["Tequila shots"],
  roast:"TEQUILA SHOTS.\nNobody in history has taken only one shot. \"Last one\" is said minimum four times.\n\nSalt. Lime. And a video you'll beg your friends to delete before Monday.",
  who:"The birthday person, and everybody the birthday person is pointing at.",
  fix:"Decide your number before the first one. Then turn the rest into margarita."},
 {id:"four_cousins",name:"Four Cousins",cat:"Wine",type:"Aunty on the table",color:"#C94F63",s:3,p:1,ven:"omvdu",t:["sweet"],v:"ssggb",m:["Four Cousins"],
  roast:"FOUR COUSINS.\nThe wine your aunty calls \"something light\". It's not light.\n\nIt's the reason your aunty was dancing on the table at the harvest. There's a fifth cousin. It's called headache.",
  who:"Aunties, first dates on a budget, and anybody that says \"I don't like dry wine\".",
  fix:"Plenty ice and sliced orange. Now it's actually light."},
 {id:"carlo_rossi",name:"Carlo Rossi",cat:"Wine",type:"Family investment",color:"#A33A4E",s:3,p:1,ven:"omhv",t:["sweet"],v:"ssggb",m:["Carlo Rossi","Carlo"],
  roast:"CARLO ROSSI.\nWine that comes in a jug because they know how we drink in this country.\n\nNobody has ever bought Carlo Rossi for two people. It is a family investment with a handle on it.",
  who:"Anybody hosting more than six people on a budget.",
  fix:"Over ice with sliced orange and small sprite. Stretch the jug."},
 {id:"nederburg",name:"Nederburg",cat:"Wine",type:"Started reading labels",color:"#6E3A4A",s:3,p:2,ven:"dfom",t:["smooth"],v:"sgggg",m:["Nederburg"],

/* ── errors. Named, never swallowed. A bare catch is what hid the dead storage
      layer for the entire life of this file. */
class ShayoError extends Error {
  constructor(op, detail, cause){
    super(op + ": " + detail);
    this.name = "ShayoError"; this.op = op; this.cause = cause;
  }
}
const reported = {};
function report(err, userMessage){
  if (typeof console !== "undefined") console.error(err);
  if (userMessage && !reported[err.op]){ reported[err.op] = 1; toast(userMessage, true); }
}

/* ── the link. Every card that leaves carries it, or the card is pointless. */
function shareUrl(hash){
  let base = LIVE_URL;
  if (!base){
    const u = location.href.split("#")[0];
    if (/^https?:/.test(u) && !/claudeusercontent|claude\.ai/.test(u)) base = u;
  }
  return base ? base + (hash ? "#" + hash : "") : "";
}
const LINK_OK = (() => { try { return !!shareUrl(""); } catch(e){ return false; } })();

/* ── storage. localStorage, namespaced and capped. A heavy user writes ~700 events
      a year, about 84KB against a 5MB budget, and it is synchronous, which is what
      the cold-open budget actually needs. */
const store = {
  ns:"shayo:",
  available:(() => {
    try { localStorage.setItem("shayo:probe", "1"); localStorage.removeItem("shayo:probe"); return true; }
    catch(e){ return false; }
  })(),
  get(key, fallback){
    if (fallback === undefined) fallback = null;
    if (!this.available) return fallback;
    const raw = localStorage.getItem(this.ns + key);
    if (raw === null) return fallback;
    try { return JSON.parse(raw); }
    catch(e){
      report(new ShayoError("storage.parse", key, e));
      localStorage.removeItem(this.ns + key);
      return fallback;
    }
  },
  set(key, value){
    if (!this.available){
      report(new ShayoError("storage.unavailable", key),
        "Private mode: nothing you claim tonight will be here tomorrow.");
      return false;
    }
    try { localStorage.setItem(this.ns + key, JSON.stringify(value)); return true; }
    catch(e){
      report(new ShayoError("storage.set", key, e),
        "That did not save. Try again.");
      return false;
    }
  }
};

/* ── the event log. Append-only, minimal fields. Derived values would lock in
      definitions nobody has made yet, so none are stored.
      type: name | send | search | search_empty | repeat_lookup | choice | void
            | round | dry | venue | price_report   (act two) */
const LOG_V = 1, LOG_CAP = 1200;
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function deviceId(){
  let id = store.get("device");
  if (!id){ id = uid() + uid(); store.set("device", id); }
  return id;
}
function log(type, payload){
  const e = Object.assign({
    id:uid(), v:LOG_V, deviceId:deviceId(), ts:Date.now(),
    tzOffset:new Date().getTimezoneOffset(), type
  }, payload || {});
  state.log.push(e);
  if (state.log.length > LOG_CAP) state.log.splice(0, state.log.length - LOG_CAP);
  store.set("log", state.log);
  return e;
}
/* A correction is an event, not an edit. The log stays append-only so a receipt
   can honestly show that something was removed at 11:42pm. */
function voidEvent(targetId, reason){ return log("void", {target:targetId, reason:reason || null}); }

/* ── the picture. Typographic poster in the drink's own colour. There is no photo
      path: the old one was never called from anywhere and shipped dead for months. */
function shot(d, cls = "", mode = "big"){
  const n = shortName(d), longest = n.split(" ").reduce((a, w) => Math.max(a, w.length), 0);
  const size = mode === "small" ? Math.min(40, 250 / longest)
             : mode === "mid" ? Math.min(64, 420 / longest)
             : Math.min(104, 620 / longest);
  return `<div class="shot tone ${cls}" style="background:${d.color}">`
    + `<b style="font-size:${size}px">${esc(n)}</b></div>`;
}

function buildOrder(){
  const first = OPENERS.filter(id => BY[id]);
  const rest = D.map(d => d.id).filter(id => !first.includes(id) && !BY[id].noPick);
  for (let i = rest.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
  state.order = first.concat(rest);
}

/* ── roasts. One line per drink was the content risk act one could not survive:
      the same friend orders Alomo twice and the second card is a repeat, and a
      repeated joke is not sendable. `roasts` takes an array and rotates on repeat
      lookup. `roast` stays the fallback so the 73 shipped lines keep working
      untouched. Filling `roasts` is a writing job, not an engineering one. */
function roastList(d){ return Array.isArray(d.roasts) && d.roasts.length ? d.roasts : [d.roast]; }
function roastFor(d){ const l = roastList(d); return l[(state.seen[d.id] || 0) % l.length]; }
function roastCount(){ return D.reduce((n, d) => n + roastList(d).length, 0); }

/* The feed carries the hook. Anything longer than a thumb-length gets cut at a
   sentence and finished on the drink page, which is also what makes people tap. */
function hook(body, limit){
  if (!limit) limit = (typeof window !== "undefined" && window.innerHeight < 700) ? 150 : 200;
  if (body.length <= limit) return {text:body, cut:false};
  let out = "";
  for (const part of body.split(/(?<=[.!?])\s+/)){
    if ((out + part).length > limit && out) break;
    out += (out ? " " : "") + part;
  }
  return {text:out || body.slice(0, limit - 10).trim(), cut:true};
}
function slideInner(id){

    <div class="slidebody">
      <span class="cat"><i></i>${esc(d.cat)}</span>
      <h2 class="dname">${esc(head ? head.replace(/[.!]$/, "") : d.name)}</h2>
      <p class="roast">${esc(h.text)}</p>
      <button class="more" data-a="open" data-v="${id}">${h.cut ? "Read the rest" : "Can I handle it, and how to drink am"}</button>

        <button class="act${mine ? " on" : ""}" data-a="mine" data-v="${id}" aria-pressed="${!!mine}">${svg("hand")}<span>${mine ? "Na you" : "Na me"}</span></button>

    </div>`;
}
/* Windowed. 73 full-viewport slides mounting at launch was the load cost; the
   elements stay so scroll height and snap points never move, the contents do not. */
const WINDOW = 2;
function slideShell(id, i){
  const near = i <= WINDOW;
  return `<article class="slide" data-i="${i}" data-id="${id}" aria-label="${esc(BY[id].name)}">${near ? slideInner(id) : ""}</article>`;
}
/* `live` is the set of indices currently holding markup. Without it, slides you
   scrolled past are never revisited and never emptied, so the DOM refills to all 73
   and the windowing buys nothing. */
const live = new Set();
function fill(feed, i){
  const el = feed.children[i];
  if (!el || el.firstChild) return;
  el.innerHTML = slideInner(el.dataset.id);
  live.add(i);
}
function empty(feed, i){
  const el = feed.children[i];
  if (!el || !el.firstChild) { live.delete(i); return; }
  el.innerHTML = "";
  live.delete(i);
}

/* ── the picker. Search is the primary job now, not a corner icon. */
function matches(){
  const q = state.q.trim().toLowerCase(), f = state.f;
  const band = f.strength && STRENGTH_BANDS.find(b => b.val === f.strength);
  return D.filter(d => {
    if (q){
      const hay = (d.name + " " + (d.aka || "") + " " + d.cat + " " + d.type + " " +
        (d.m || []).join(" ") + " " + (d.t || []).join(" ")).toLowerCase();
      if (!hay.includes(q)) return false;
    } else if (state.cat !== "All" && d.cat !== state.cat) return false;
    if (band && !band.test(d.s)) return false;
    if (f.venue && !(d.ven || "").includes(VEN[f.venue].code)) return false;
    if (f.taste && !(d.t || []).includes(f.taste)) return false;
    return true;
  });
}
function anyFilter(){ return activeCount() > 0; }
function activeCount(){ return [state.f.strength, state.f.venue, state.f.taste].filter(Boolean).length; }
function gridHTML(){
  const list = matches();
  if (!list.length){
    return `<div class="empty"><b>We never roast that one yet.</b>
      <p>${state.q ? `Nothing matches &ldquo;${esc(state.q)}&rdquo;.` : "Nothing matches those filters."}
      Try the brand name on the bottle, like Gulder, or drop a filter.</p>
      ${anyFilter() ? `<button class="btn quiet" data-a="clearf">Clear filters</button>` : ""}</div>`;
  }
  return `<p class="count"><span>${list.length} ${list.length === 1 ? "drink" : "drinks"}${state.q ? ", every category" : ""}</span>
      ${anyFilter() ? `<button data-a="clearf">Clear filters</button>` : ""}</p>
    <div class="pgrid">${list.map(d => `<button class="pcard" data-a="open" data-v="${d.id}">${shot(d, "", "small")}<div class="veil"></div><span><b>${esc(d.name)}</b><em>${esc(d.type)}</em></span></button>`).join("")}</div>`;
}

/* Experience does not transfer across a shelf. Ten years of Star tells us nothing
   about how you handle Ogogoro. So tolerance is measured inside the family you are
   asking about, and the answer is always relative to what you already drink. */
const FAMILY = {
  Beer:"Beer and stout", Stout:"Beer and stout", "Ready to drink":"Beer and stout",
  Whisky:"Brown spirits", Cognac:"Brown spirits", Rum:"Brown spirits",
  Vodka:"Clear spirits", Gin:"Clear spirits", Tequila:"Clear spirits",
  Bitters:"Bitters and local", Local:"Bitters and local",
  Wine:"Wine and bubbles", Bubbles:"Wine and bubbles", Liqueur:"Wine and bubbles",
  Cocktail:"Cocktails", "No alcohol":"Soft"
};
const fam = d => FAMILY[d.cat] || d.cat;
function myDrinks(){ return Object.keys(state.mine).filter(id => state.mine[id]).map(id => BY[id]); }
function baseline(family){
  const inFam = myDrinks().filter(x => fam(x) === family);
  if (!inFam.length) return null;
  return {level:Math.max(...inFam.map(x => x.s)), top:inFam.slice().sort((a, b) => b.s - a.s)[0]};
}
function tolerance(d){
  const f = fam(d), b = baseline(f), all = myDrinks();
  if (!all.length) return {state:"unknown"};
  if (!b){
    const other = all.slice().sort((a, x) => x.s - a.s)[0];
    return {state:"new", family:f, other};
  }
  return {state:"known", family:f, step:d.s - b.level, top:b.top};
}
function toleranceBlock(d){
  const t = tolerance(d), f = fam(d);
  if (t.state === "unknown")
    return `<section><h3>Can you handle it?</h3>
      <p>We cannot say yet. Tap <strong>Na me</strong> on one drink you actually order and we go know your level on this shelf.</p></section>`;
  if (t.state === "new")
    return `<section><h3>Can you handle it?</h3>
      <p><span class="pill v-s">New shelf</span><br>You have never claimed anything from ${esc(f.toLowerCase())}.
      ${esc(t.other.name)} does not count here. Start with one glass and food inside your stomach.</p>
      ${scale(d, null)}</section>`;
  const step = t.step;
  const v = step <= -2 ? {c:"v-b", l:"Below your level"} : step <= 0 ? {c:"v-g", l:"Within range"}
          : step === 1 ? {c:"v-s", l:"One step up"} : step === 2 ? {c:"v-s", l:"Two steps up"}
          : {c:"v-n", l:step + " steps up"};
  const line = step <= -2 ? `You already handle ${esc(t.top.name)}. This one is small for you.`
    : step <= 0 ? `Same level as the ${esc(t.top.name)} you claimed. You fit drink am.`
    : step === 1 ? `One step above your ${esc(t.top.name)}. You go feel am, but you go dey alright.`
    : step === 2 ? `Two steps above your ${esc(t.top.name)}. Eat first, then count your glasses.`
    : `${step} steps above your ${esc(t.top.name)}. Not tonight, unless somebody is driving you home.`;
  return `<section><h3>Can you handle it? On ${esc(f.toLowerCase())}</h3>
    <p><span class="pill ${v.c}">${v.l}</span><br>${line}</p>
    ${scale(d, t.top)}</section>`;
}
function scale(d, top){
  return `<div class="scale">
    <div class="bar" role="img" aria-label="Strength ${d.s} of 5">${[1,2,3,4,5].map(n => `<i class="${n <= d.s ? "on" : ""}"></i>`).join("")}</div>
    <div class="legend"><span>${esc(d.name)} sits at ${d.s} of 5</span>${top ? `<span>You: ${esc(top.name)} at ${top.s}</span>` : `<span>You: nothing here yet</span>`}</div>
  </div>`;
}

/* ── the status card. One component. This markup and the canvas export below
      draw the same anatomy, so what you preview is what lands in the group. */
function cardText(d){
  const {head, body} = splitRoast(roastFor(d));
  return {title:(head || d.name).replace(/[.!]$/, ""), line:hook(body, 132).text};
}
function tickSeconds(text){
  /* BRAND.md's one motion constant: 5 to 13s scaled to roast length. */
  return Math.max(5, Math.min(13, Math.round(text.length / 16)));
}
/* Relative luminance, so the card never ships type nobody can read. WhatsApp's
   4:2:0 chroma subsampling makes a low-contrast card worse than it looks here. */
function lum(hex){
  const v = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}
function contrast(a, b){
  const x = lum(a), y = lum(b);
  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
}
/* Paper on most grounds, ink on the pale ones. Kunu at #B99B6A is 2.34:1 against
   paper and 8.0:1 against ink; the poster grid hid this behind a veil the card
   does not have. */
function cardInk(color){ return contrast(PAPER, color) >= contrast(INK, color) ? PAPER : INK; }

function statusCard(d, opt){
  const t = cardText(d), secs = tickSeconds(t.line), dark = cardInk(d.color) === INK;
  return `<div class="statuswrap${dark ? " inked" : ""}" style="background:${d.color};--tick:${secs}s">
    <div class="crate"></div>
    <div class="ticks" aria-hidden="true"><i class="${opt && opt.live ? "on" : ""}"></i><i></i><i></i></div>
    <p class="stitle">${esc(t.title)}</p>
    <p class="stext">${esc(t.line)}</p>
    <div class="sfoot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">${ICON.cork}</svg>${esc(cardUrlLabel())}</div>
  </div>`;
}
function cardUrlLabel(){
  const u = shareUrl("");
  if (!u) return BRAND;
  return u.replace(/^https?:\/\//, "").replace(/\/$/, "");
}

/* 1080x1920, drawn not screenshotted. WhatsApp recompresses to roughly 1600px on
   the long edge at 60-70% JPEG with 4:2:0 chroma, which eats thin strokes and light
   greys, so this is flat saturated ground and Archivo 800/900 only. The top and
   bottom 250px sit under the profile chip and the caption, so nothing lives there. */
function wrapLines(ctx, text, maxWidth){
  const out = [];
  for (const para of String(text).split("\n")){
    let line = "";
    for (const w of para.split(/\s+/)){
      const next = line ? line + " " + w : w;
      if (ctx.measureText(next).width > maxWidth && line){ out.push(line); line = w; }
      else line = next;
    }
    out.push(line);
  }
  return out;
}
function drawCrate(ctx, W, H, alpha, color){
  ctx.save();
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = 3.4;
  const tile = 320 * (W / 1080) * 2.6, cw = tile / 6, ch = tile / 4, r = tile / 20;
  for (let y = ch / 2; y < H + ch; y += ch){
    for (let x = cw / 2; x < W + cw; x += cw){
      ctx.beginPath(); ctx.setLineDash([6, 6]); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
      ctx.beginPath(); ctx.setLineDash([]); ctx.arc(x, y, r * 0.44, 0, 6.2832); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawCork(ctx, x, y, r, color){
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = r * 0.26;
  ctx.beginPath(); ctx.setLineDash([r * 0.30, r * 0.29]); ctx.arc(x, y, r * 0.92, 0, 6.2832); ctx.stroke();
  ctx.setLineDash([]); ctx.lineWidth = r * 0.16;
  ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, 6.2832); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r * 0.30, 0, 6.2832); ctx.stroke();
  ctx.restore();
}
async function cardCanvas(d){
  const W = 1080, H = 1920, SAFE = 250, PAD = 96;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  if (!ctx) throw new ShayoError("card.context", "2d context unavailable");
  if (document.fonts && document.fonts.ready){
    try { await document.fonts.load("900 96px Archivo"); await document.fonts.ready; }
    catch(e){ report(new ShayoError("card.font", "Archivo did not load, falling back", e)); }
  }
  const ink = cardInk(d.color);
  ctx.fillStyle = d.color; ctx.fillRect(0, 0, W, H);
  drawCrate(ctx, W, H, 0.2, ink);

  const t = cardText(d), maxW = W - PAD * 2;
  ctx.textBaseline = "top";

  /* measure first so the payload is centred inside the band between the safe zones */
  ctx.font = "900 92px Archivo, sans-serif";
  const titleLines = wrapLines(ctx, t.title.toUpperCase(), maxW);
  ctx.font = "800 46px Archivo, sans-serif";
  const bodyLines = wrapLines(ctx, t.line, maxW);
  const tickH = 14, gapA = 74, titleH = titleLines.length * 86, gapB = 54;
  const bodyH = bodyLines.length * 60, gapC = 78, footH = 46;
  const total = tickH + gapA + titleH + gapB + bodyH + gapC + footH;
  let y = SAFE + Math.max(0, (H - SAFE * 2 - total) / 2);

  /* three progress ticks, the first one filled */
  for (let i = 0; i < 3; i++){
    ctx.fillStyle = ink;
    ctx.globalAlpha = i === 0 ? 1 : 0.34;
    const w = 74, x = PAD + i * (w + 16);
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, tickH, tickH / 2); else ctx.rect(x, y, w, tickH);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  y += tickH + gapA;

  ctx.fillStyle = ink;
  ctx.font = "900 92px Archivo, sans-serif";
  for (const line of titleLines){ ctx.fillText(line, PAD, y); y += 86; }
  y += gapB;

  ctx.font = "800 46px Archivo, sans-serif";
  for (const line of bodyLines){ ctx.fillText(line, PAD, y); y += 60; }
  y += gapC;

  /* the URL is type, not a link. Links are the exception in Nigerian status. */
  drawCork(ctx, PAD + 22, y + 20, 26, ink);
  ctx.font = "800 38px Archivo, sans-serif";
  ctx.fillText(cardUrlLabel(), PAD + 62, y + 2);
  return c;
}
function canvasBlob(c){
  return new Promise((res, rej) => {
    c.toBlob(b => b ? res(b) : rej(new ShayoError("card.encode", "toBlob returned null")), "image/jpeg", 0.92);
  });
}

/* ── the pick. Two answers in, one drink out. */
function prescribe(){
  const a = state.ask, ven = VEN[a.venue];
  const mine = myDrinks();
  /* Your level is the strongest thing you have claimed, not a number you typed. */
  const st = mine.length ? Math.max(0, Math.min(4, Math.round(mine.reduce((m, d) => Math.max(m, d.s), 0)) - 1)) : 2;
  const early = a.tmr === "early" || a.tmr === "service";
  const score = d => {
    if (d.noPick) return -9999;
    const c = d.v[st];
    let s = c === "g" ? 30 : c === "s" ? 12 : c === "n" ? -80 : -20;
    if (d.ven.includes(ven.code)) s += 26;
    if (early) s -= Math.max(0, d.s - 2) * 12;
    else if (a.tmr === "flex") s -= Math.max(0, d.s - 3) * 8;
    else s += d.s * 2;
    if (a.venue === "joint" && d.cat === "Cocktail") s -= 18;
    if (d.s === 0 && a.tmr !== "early") s -= 24;
    return s + Math.random() * 6;
  };
  const ranked = D.filter(d => !d.noPick).map(d => ({d, s:score(d)})).sort((x, y) => y.s - x.s);
  const pick = ranked[0].d, runner = ranked[1].d;
  const bad = D.filter(d => d.id !== pick.id && d.id !== runner.id).map(d => {
    let reason = null;
    if (d.id === "sachet_gin") reason = "Pure water price, mortgage consequences.";
    else if (d.id === "paraga") reason = "Motor park medicine. Leave it.";
    else if (d.v[st] === "n") reason = "Above your level, and tonight is not the night to test it.";
    else if (early && d.s >= 4) reason = a.tmr === "service" ? "The usher will smell it before you sit down." : "You have work by 8am. Tomorrow you is begging us.";
    if (!reason) return null;
    return {d, reason, w:(d.ven.includes(ven.code) ? 20 : 0) + Math.random() * 5};
  }).filter(Boolean).sort((x, y) => y.w - x.w);
  const why = [];
  const c = pick.v[st];
  why.push(c === "g" ? `For a ${STAGES[st].name}, this one is within range.` : c === "s" ? `For a ${STAGES[st].name}, you can handle it if you are counting.` : `It is small for you, but it fits tonight.`);
  if (pick.ven.includes(ven.code)) why.push(`It fits ${ven.label.toLowerCase()}.`);
  why.push(a.tmr === "early" ? "You have work by 8am, so this is your ceiling."
    : a.tmr === "service" ? "You have service in the morning. You will not sleep through the sermon."
    : a.tmr === "flex" ? "You have something by 12. You will still look human."
    : "Nothing tomorrow. You fit try something with small power.");
  state.ask.result = {pick, runner, avoid:bad[0] || null, why:why.join(" ")};
}


/* ══════════════════════════════════════════════════════════════════════════
   ACT TWO. The tab, the total, Settle, the ledger, the radar, the shelf.

   None of this is a new store. Every screen below is a fold over the same
   append-only log act one already writes:
     the tab     = tonight's `round` events
     the ledger  = the same events folded by month
     the radar   = a median over `price_report`
     the shelf   = a fold over `choice` and `round`
   Four surfaces, one core and three reducers.
   ══════════════════════════════════════════════════════════════════════════ */

/* A drinking night rolls past midnight, so 1am Sunday belongs to Saturday. */
const NIGHT_ROLL_H = 6;
function nightKey(ts){
  const d = new Date((ts || Date.now()) - NIGHT_ROLL_H * 36e5);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function nightLabel(key){
  const [y, m, d] = key.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"});
}
const naira = n => "₦" + Math.round(n).toLocaleString("en-NG");
const clock = ts => new Date(ts).toLocaleTimeString("en-GB", {hour:"numeric", minute:"2-digit", hour12:true}).replace(" ", "").toLowerCase();

/* ── folds. A void references the id it cancels, so nothing is ever edited. */
function voidedIds(){
  const v = new Set();
  for (const e of state.log) if (e.type === "void") v.add(e.target);
  return v;
}
function roundsOn(night, includeVoid){
  const v = voidedIds();
  return state.log.filter(e => e.type === "round" && e.night === night && (includeVoid || !v.has(e.id)));
}
function nightTotal(night){ return roundsOn(night).reduce((n, e) => n + e.qty * (e.price || 0), 0); }
function nightCount(night){ return roundsOn(night).reduce((n, e) => n + e.qty, 0); }
function isDry(night){
  const v = voidedIds();
  const marks = state.log.filter(e => e.type === "dry" && e.night === night && !v.has(e.id));
  return marks.length > 0 && roundsOn(night).length === 0;
}
function nextSeq(night){ return roundsOn(night, true).length + 1; }
function nightVenue(night){
  const v = voidedIds();
  const marks = state.log.filter(e => e.type === "venue" && e.night === night && !v.has(e.id));
  return marks.length ? marks[marks.length - 1].name : null;
}
/* The price you already paid for this drink tonight. Asked once, reused after. */
function knownPrice(drinkId, night){
  const r = roundsOn(night, true).filter(e => e.drink === drinkId && e.price);
  return r.length ? r[r.length - 1].price : null;
}

/* ── the six tiles. A first-ever night has no history, so these are the
      national favourites, labelled as such. Never an empty grid. */
const FAVOURITES = ["star", "gulder", "guinness", "hennessy", "trophy", "alomo"];
function myTiles(){
  const count = {};
  for (const e of state.log) if (e.type === "round") count[e.drink] = (count[e.drink] || 0) + e.qty;
  for (const id of Object.keys(state.mine)) if (state.mine[id]) count[id] = (count[id] || 0) + 0.5;
  const mine = Object.keys(count).filter(id => BY[id]).sort((a, b) => count[b] - count[a]).slice(0, 6);
  /* "cold" means a first-ever night, not a partly-filled one. Labelling six tiles
     as the national favourites while three of them are already yours is a lie the
     user can see. */
  return {ids:mine.length >= 6 ? mine : mine.concat(FAVOURITES.filter(id => !mine.includes(id))).slice(0, 6),
          cold:mine.length === 0};
}

function tile(id){
  const d = BY[id];
  const n = roundsOn(state.night).filter(e => e.drink === id).reduce((a, e) => a + e.qty, 0);
  const ink = cardInk(d.color);
  const name = shortName(d), longest = name.split(" ").reduce((a, w) => Math.max(a, w.length), 0);
  return `<button class="tile" data-hold="tile" data-v="${id}" style="background:${d.color};color:${ink}"
      aria-label="${esc(d.name)}${n ? ", " + n + " so far" : ""}. Tap to add one.">

    ${n ? `<i class="badge" data-hold="unbadge" data-v="${id}" role="status">${n}</i>` : ""}

}

/* ── Surface 2: the running total. A sum, never a remainder, and it never

function itemList(){

/* ── Surface 3: Settle. A paper till receipt, because that format needs no

function vSettle(){
