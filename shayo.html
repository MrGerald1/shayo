/* ── Surface 4: the ledger. A grid is read for pattern, not for score, as
      long as no cell is coloured as failure. Dry nights are markable and
      never count, never chain, never congratulate and never prompt. */
const TRANSLATIONS = [
  {unit:1500, one:"a 2GB MTN bundle", many:n => `${n} monthly 2GB MTN bundles`},
  {unit:6000, one:"a 15GB bundle", many:n => `${n} 15GB bundles`},
  {unit:1200, one:"a Lagos danfo week", many:n => `${n} weeks of danfo fares`},
  {unit:25000, one:"a pair of shoes", many:n => `${n} pairs of shoes`},
  {unit:180000, one:"a return ticket to Accra", many:n => `${n} return tickets to Accra`}
];
/* Never school fees, rent, medical costs, or anything a dependant needs. Those
   are not translations, they are verdicts wearing a translation's clothes. */
function translate(total){
  if (total <= 0) return null;
  let best = TRANSLATIONS[0];
  for (const t of TRANSLATIONS) if (total / t.unit >= 1) best = t;
  const n = Math.floor(total / best.unit);
  return n <= 1 ? best.one : best.many(n);
}
function monthKey(night){ return night.slice(0, 7); }
function vLedger(){
  const mk = state.month || monthKey(nightKey());
  const [y, m] = mk.split("-").map(Number);
  const days = new Date(y, m, 0).getDate();
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const nights = [];
  for (let d = 1; d <= days; d++) nights.push(`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
  const totals = nights.map(nightTotal);
  const peak = Math.max(1, ...totals);
  const month = totals.reduce((a, b) => a + b, 0);
  const t = translate(month);
  const today = nightKey();
  return `<div class="screen light"><main class="pad">
    <header class="head"><button class="iconbtn" data-a="tab" aria-label="Back to tonight">${svg("back")}</button>
      <h1>${new Date(y, m - 1, 1).toLocaleDateString("en-GB", {month:"long", year:"numeric"})}</h1>
      <button class="iconbtn" data-a="prevmonth" aria-label="Previous month">${svg("back")}</button></header>

    <p class="big">${naira(month)}</p>
    ${t ? `<p class="lede">That is ${esc(t)}.</p>` : `<p class="lede">Nothing logged this month.</p>`}

    <div class="cal" role="grid" aria-label="Nights this month">
      ${["M","T","W","T","F","S","S"].map(d => `<span class="caph">${d}</span>`).join("")}
      ${Array(lead).fill('<span></span>').join("")}
      ${nights.map((nk, i) => {
        const v = totals[i], dry = isDry(nk), future = nk > today;
        const lvl = v <= 0 ? 0 : Math.min(4, Math.ceil(v / peak * 4));
        return `<button class="cell l${lvl}${dry ? " dry" : ""}${nk === today ? " today" : ""}" data-a="night" data-v="${nk}"
          ${future ? "disabled" : ""} aria-label="${nightLabel(nk)}${dry ? ", no drinks" : v > 0 ? ", " + naira(v) : ", nothing logged"}">
          <span>${Number(nk.slice(8))}</span></button>`;
      }).join("")}
    </div>
    <p class="note"><i class="key l2"></i> spend &nbsp; <i class="key dry"></i> marked no drinks</p>
    ${state.pickNight ? nightSheetBody() : ""}
    <button class="btn quiet" data-a="tab">Back to tonight</button>
    <p class="foot">${esc(SAFETY)}</p>
  </main></div>`;
}
function nightSheetBody(){
  const nk = state.pickNight, v = nightTotal(nk), dry = isDry(nk);
  const rows = roundsOn(nk);
  return `<div class="block">
    <section><h3>${esc(nightLabel(nk))}</h3>
      ${rows.length ? `<p>${naira(v)} across ${nightCount(nk)} rounds.</p>`
        : dry ? `<p>Marked: no drinks.</p>` : `<p>Nothing logged.</p>`}
      ${rows.length ? "" : `<button class="btn quiet" data-a="dry" data-v="${nk}">${dry ? "Unmark" : "Mark"} no drinks</button>`}
    </section>
  </div>`;
}

/* ── Surface 5: the price radar. Three bands, and the count is visible in all
      of them. Numbeo withholds prices below a threshold it never publishes,
      so nobody can tell whether the gap is three reports away or hopeless. */
const RADAR_MIN = 5;
/* One report per person, latest price wins. Counting price_report events would
   count rounds, not reporters: one drinker ordering five Stars would trip the
   threshold on their own and publish a "median" sourced from one person. A number
   nobody can trust is worse than no number, which is the whole Index argument. */
function reportsFor(drinkId, area){
  const byPerson = new Map();
  for (const e of state.log){
    if (e.type !== "price_report" || e.drink !== drinkId) continue;
    if (area && (e.area || "").toLowerCase() !== area.toLowerCase()) continue;
    byPerson.set(e.deviceId, e);
  }
  return [...byPerson.values()];
}
function median(ns){
  if (!ns.length) return 0;
  const s = ns.slice().sort((a, b) => a - b), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function vRadar(){
  const id = state.radarDrink || "star", d = BY[id];
  const area = state.area || nightVenue(state.night) || "your area";
  const reps = reportsFor(id, state.area);
  const n = reps.length, med = median(reps.map(r => r.price));
  let body;
  if (n === 0){
    body = `<div class="empty"><b>Nobody has reported ${esc(shortName(d))} in ${esc(area)} yet.</b>
      <p>You would be the first. One price, and the next person who gets charged double will know.</p>
      <button class="btn" data-a="report" data-v="${id}">Report what you just paid</button></div>`;
  } else if (n < RADAR_MIN){
    body = `<div class="empty"><b>${n} ${n === 1 ? "person has" : "people have"} reported ${esc(shortName(d))} here.</b>
      <p>We show a price at ${RADAR_MIN}. That is ${RADAR_MIN - n} more.</p>
      <div class="bar" role="img" aria-label="${n} of ${RADAR_MIN} reports">${Array.from({length:RADAR_MIN}, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div>
      <button class="btn" data-a="report" data-v="${id}">Add yours</button></div>`;
  } else {
    body = `<div class="block"><section><h3>${esc(shortName(d))} in ${esc(area)}</h3>
      <p class="big">${naira(med)}</p>
      <p>Median of ${n} reports. If somebody charges you much more than this, ask them why.</p>
      </section></div>
      <button class="btn quiet" data-a="report" data-v="${id}">Add tonight's price</button>`;
  }
  return `<div class="screen light"><main class="pad">
    <header class="head"><button class="iconbtn" data-a="tab" aria-label="Back to tonight">${svg("back")}</button>
      <h1>Price radar</h1></header>
    <div class="chips">${FAVOURITES.concat(["heineken","chapman"]).filter(x => BY[x]).map(x =>
      `<button class="chip${x === id ? " on" : ""}" data-a="radardrink" data-v="${x}">${esc(shortName(BY[x]))}</button>`).join("")}</div>
    ${body}
    <p class="note">A band on a drink page is a guess. This is measured, and it only counts what people actually paid.</p>
    <button class="btn quiet" data-a="tab">Back to tonight</button>
  </main></div>`;
}

/* ── identity. Your shelf, folded out of what you have claimed and logged. */
function vShelf(){
  const claimed = myDrinks();
  const logged = {};
  for (const e of state.log) if (e.type === "round") logged[e.drink] = (logged[e.drink] || 0) + e.qty;
  const fams = {};
  claimed.concat(Object.keys(logged).map(id => BY[id]).filter(Boolean)).forEach(d => {
    const f = fam(d); fams[f] = Math.max(fams[f] || 0, d.s);
  });
  const ranked = Object.entries(fams).sort((a, b) => b[1] - a[1]);
  const top = ranked[0];
  const strongest = claimed.slice().sort((a, b) => b.s - a.s)[0];
  const nights = new Set(state.log.filter(e => e.type === "round").map(e => e.night)).size;
  const spent = [...new Set(state.log.filter(e => e.type === "round").map(e => e.night))].reduce((a, nk) => a + nightTotal(nk), 0);
  return `<div class="screen light"><main class="pad">
    <header class="head"><button class="iconbtn" data-a="tab" aria-label="Back to tonight">${svg("back")}</button>
      <h1>Your shelf</h1></header>
    ${claimed.length || nights ? `
    <div class="block">
      ${top ? `<section><h3>Your level</h3><p><span class="pill v-s">${esc(STAGES[Math.max(0, Math.min(4, top[1] - 1))].name)}</span><br>
        ${top[1]} of 5 on ${esc(top[0].toLowerCase())}${strongest ? `, off ${esc(strongest.name)}` : ""}.</p></section>` : ""}
      ${nights ? `<section><h3>Nights logged</h3><p>${nights}, ${naira(spent)} in total.</p></section>` : ""}
      <section><h3>What you claim</h3><p>${claimed.length ? claimed.map(d => esc(d.name)).join(", ") : "Nothing yet."}</p></section>
    </div>
    ${claimed.length ? `<div class="shelf">${claimed.map(d => `<button class="pcard" data-a="open" data-v="${d.id}">${shot(d, "", "small")}<div class="veil"></div><span><b>${esc(shortName(d))}</b></span></button>`).join("")}</div>` : ""}
    ` : `<div class="empty"><b>Nothing on your shelf yet.</b>
      <p>Tap <strong>Na me</strong> on a drink you actually order, and this fills in.</p>
      <button class="btn" data-a="feed">Go and claim something</button></div>`}
    <button class="btn quiet" data-a="tab">Back to tonight</button>
    <p class="foot">${esc(SAFETY)}</p>
  </main></div>`;
}

/* ── the number pad. Prices are asked once per drink per night and reused,
      which is what keeps the fast path one tap and feeds the radar as a side
      effect rather than as unpaid labour. */
function askPrice(id, qty){
  const d = BY[id];
  state.pad = {id, qty, value:"", mode:"price"};
  padSheet(`How much is ${esc(shortName(d))} here?`, "Once tonight. Every tap after this is one tap.");
}
function askQty(id){
  const d = BY[id];
  state.pad = {id, qty:0, value:"", mode:"qty"};
  padSheet(`How many ${esc(shortName(d))}?`, "A round in Nigeria is bought for a table, not a person.");
}
function padSheet(title, sub){
  const p = state.pad;
  const shown = p.mode === "price" ? (p.value ? naira(Number(p.value)) : "₦0") : (p.value || "0");
  sheet(`<h2>${title}</h2><p class="lede">${sub}</p>
    <p class="big" id="padval">${shown}</p>
    <div class="pad9">${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="key9" data-a="padkey" data-v="${n}">${n}</button>`).join("")}
      <button class="key9" data-a="padkey" data-v="back" aria-label="Delete">&larr;</button>
      <button class="key9 go" data-a="padok">${svg("check", 2.6)}</button></div>
    <button class="btn quiet" data-a="closesheet">Cancel</button>`);
}

function addRound(id, qty, price){
  const night = state.night;
  const known = knownPrice(id, night);
  const e = log("round", {drink:id, qty:qty || 1, price:price || known || null,
    night, seq:nextSeq(night)});
  /* only the first time a price is named tonight, not once per round */
  if (e.price && !known) log("price_report", {drink:id, price:e.price, night, area:nightVenue(night) || null});
  return e;
}

/* ── render. Full repaint on screen change only. Two call sites used to repaint
      the whole feed for a one-button change; both now patch in place. */
const DARK = {gate:1, under:1, feed:1};
function render(){
  const v = {gate:vGate, under:vUnder, feed:vFeed, browse:vBrowse, drink:vDrink, ask:vAsk,
    tab:vTab, settle:vSettle, ledger:vLedger, radar:vRadar, shelf:vShelf}[state.screen];
  if (!v) throw new ShayoError("render.screen", "no view for " + state.screen);
  document.getElementById("app").innerHTML = (LINK_OK ? "" : devWarn()) + v();
  const tc = document.getElementById("tc");
  if (tc) tc.setAttribute("content", DARK[state.screen] ? INK : PAPER);
  if (state.screen === "feed") wireFeed();
  if (state.screen === "browse") wireSearch();
}
function devWarn(){
  return `<div class="devwarn">LIVE_URL is empty, so every card leaves without a link back. Set it in shayo.html before you send anything.</div>`;
}
function go(s){ state.screen = s; render(); if (state.screen !== "feed") window.scrollTo(0, 0); }

let searchT;
function wireSearch(){
  const inp = document.getElementById("q");
  if (!inp) return;
  inp.addEventListener("input", e => {
    state.q = e.target.value;
    document.getElementById("grid").innerHTML = gridHTML();
    /* one event per settled query, not one per keystroke */
    clearTimeout(searchT);
    searchT = setTimeout(() => {
      const q = state.q.trim();
      if (!q) return;
      log(matches().length ? "search" : "search_empty", {q:q.toLowerCase(), n:matches().length});
    }, 600);
  });
}
function paintWindow(i){
  const feed = document.getElementById("feed");
  if (!feed) return;
  state.idx = i;
  const lo = Math.max(0, i - WINDOW), hi = Math.min(feed.children.length - 1, i + WINDOW);
  for (const k of Array.from(live)) if (k < lo || k > hi) empty(feed, k);
  for (let k = lo; k <= hi; k++) fill(feed, k);
}
function wireFeed(){
  const feed = document.getElementById("feed");
  if (!feed) return;
  /* IntersectionObserver rather than a scroll handler with a rAF guard: hydration
     must not depend on requestAnimationFrame, which stops in a backgrounded tab.
     Switch to WhatsApp mid-feed and come back, and rAF-gated hydration hands you a
     blank slide. This fires on its own. */
  if (state.io) state.io.disconnect();
  state.idx = 0;
  live.clear();
  for (let k = 0; k <= WINDOW && k < feed.children.length; k++) live.add(k);
  paintWindow(0);
  state.io = new IntersectionObserver(entries => {
    let best = null;
    for (const e of entries){
      if (!e.isIntersecting) continue;
      if (!best || e.intersectionRatio > best.intersectionRatio) best = e;
    }
    if (!best) return;
    const i = Number(best.target.dataset.i);
    if (i !== state.idx) paintWindow(i);
  }, {root:feed, threshold:0.5});
  for (const el of feed.children) state.io.observe(el);
}

let toastT;
function toast(msg, bad){
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.toggle("bad", !!bad);
  t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), bad ? 4200 : 2200);
}
function sheet(html){
  const s = document.getElementById("sheet");
  s.hidden = false;
  s.innerHTML = `<button class="scrim" data-a="closesheet" aria-label="Close"></button><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
}
function closeSheet(){ const s = document.getElementById("sheet"); s.hidden = true; s.innerHTML = ""; }

/* Na me is the personalisation. Three of them and we name you, which sets every verdict. */
function nameThem(){
  const mine = myDrinks();
  const fams = {};
  mine.forEach(d => { const f = fam(d); fams[f] = Math.max(fams[f] || 0, d.s); });
  const named = Object.entries(fams).sort((a, b) => b[1] - a[1]);
  const top = named[0], gaps = Object.keys(FAMILY).map(c => FAMILY[c])
    .filter((f, i, a) => a.indexOf(f) === i && !fams[f]);
  state.named = true; store.set("named", 1);
  log("name", {shelf:top[0], level:top[1], claimed:mine.length});
  sheet(`<h2>Three na me's. We have seen your shelf.</h2>
    <p class="lede">Strongest thing you claim is <strong>${esc(mine.slice().sort((a, b) => b.s - a.s)[0].name)}</strong>,
    which puts you at ${top[1]} of 5 on ${esc(top[0].toLowerCase())}.
    ${gaps.length ? "You have claimed nothing at all from " + esc(gaps.slice(0, 2).join(" or ").toLowerCase()) + ", so we go warn you there." : ""}</p>
    <p class="lede">Every &ldquo;can you handle it&rdquo; in here now answers to that, shelf by shelf.</p>
    <button class="btn" data-a="closesheet">Makes sense</button>`);
}

/* ── sending. The card is finished, cropped and ready, or it is not a share
      feature: anything that needs assembling does not travel. */
async function sendCard(id){
  const d = BY[id], link = shareUrl("d=" + d.id);
  const text = `${d.name} drinkers, this one na una 😂\n\n${roastFor(d)}\n\nWetin your own drink talk about you?${link ? "\n" + link : ""}`;
  log("send", {drink:id, roast:(state.seen[id] || 0) % roastList(d).length, link:!!link});
  if (!link) report(new ShayoError("share.nolink", "LIVE_URL unset"),
    "No link on that card. Nobody who gets it can find Shayo.");
  let blob = null;
  try { blob = await canvasBlob(await cardCanvas(d)); }
  catch(e){ report(new ShayoError("card.render", d.id, e)); }

  if (blob && navigator.canShare){
    const file = new File([blob], `shayo-${d.id}.jpg`, {type:"image/jpeg"});
    if (navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], text}); return; }
      catch(e){ if (e && e.name === "AbortError") return; report(new ShayoError("share.files", d.id, e)); }
    }
  }
  if (navigator.share){
    try { await navigator.share({text}); return; }
    catch(e){ if (e && e.name === "AbortError") return; report(new ShayoError("share.text", d.id, e)); }
  }
  /* Desktop and old WebViews: show the finished card and hand over the words. */
  const url = blob ? URL.createObjectURL(blob) : null;
  sheet(`<h2>Send it</h2>
    ${url ? `<img src="${url}" alt="${esc(d.name)} roast card" width="1080" height="1920">
      <p class="lede">Press and hold the card to save it, then post it.</p>` : ""}
    <a class="btn" href="${waHref(text)}" target="_blank" rel="noopener">${svg("share")}Open WhatsApp</a>
    <button class="btn quiet" data-a="copy" data-v="${d.id}">Copy the words</button>
    <button class="btn quiet" data-a="closesheet">Close</button>`);
}

const actions = {
  enter(){
    store.set("adult", {ok:true, ts:Date.now()});
    buildOrder();
    if (state.pending){ state.entry = "link"; state.drink = state.pending; state.pending = null; state.coach = true; openDrink(state.drink, "feed"); }
    else go("feed");
  },
  under(){ store.set("under", Date.now()); go("under"); },
  enterfeed(){ state.entry = "direct"; go("feed"); },
  gotit(){ state.coach = true; store.set("coach", 1); const c = document.querySelector(".coach"); if (c) c.remove(); },
  feed(){ state.entry = "direct"; go("feed"); },
  browse(){ state.from = "browse"; go("browse"); },
  cat(v){ state.cat = v; state.q = ""; render(); },
  filter(v){
    const [key, val] = v.split(":");
    state.f[key] = state.f[key] === val ? null : val;
    render();
  },
  clearf(){ state.f = {strength:null, venue:null, taste:null}; render(); },
  fopen(){ state.fopen = !state.fopen; render(); },
  open(id){ openDrink(id, state.from); },
  /* patched call site 1: claiming on slide 14 used to repaint the feed and drop
     you back on slide 1. Nothing but the buttons for that drink changes. */
  mine(id){
    state.mine[id] = !state.mine[id];
    const on = state.mine[id];
    store.set("mine", state.mine);
    log("choice", {drink:id, on});
    document.querySelectorAll(`[data-a="mine"][data-v="${id}"]`).forEach(el => {
      el.classList.toggle("on", on && el.classList.contains("act"));
      el.setAttribute("aria-pressed", String(on));
      const label = el.querySelector("span");
      if (label) label.textContent = on ? "Na you" : "Na me";
    });
    const n = Object.values(state.mine).filter(Boolean).length;
    if (on && n === 3 && !state.named) nameThem();
    else if (on) toast("Noted. Na you.");
  },
  share(id){ sendCard(id); },
  copy(id){
    const d = BY[id], link = shareUrl("d=" + d.id);
    const text = `${d.name} drinkers, this one na una 😂\n\n${roastFor(d)}\n\nWetin your own drink talk about you?${link ? "\n" + link : ""}`;
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(
      () => toast("Copied. Go and expose somebody."),
      e => report(new ShayoError("copy", id, e), "Could not copy. Select the words by hand."));
  },
  ask(){ state.ask = {step:0, venue:null, tmr:null, result:null}; go("ask"); },
  askback(){ state.ask.step = 0; render(); },
  venue(v){ state.ask.venue = v; state.ask.step = 1; render(); },
  tmr(v){ state.ask.tmr = v; prescribe(); render(); },
  closesheet(){ closeSheet(); state.pad = null; },

  /* ── act two */
  tab(){ state.night = nightKey(); state.items = false; go("tab"); },
  toggleitems(){ state.items = !state.items; render(); },
  settle(){ go("settle"); },
  ledger(){ state.month = monthKey(nightKey()); state.pickNight = null; go("ledger"); },
  prevmonth(){
    const [y, m] = (state.month || monthKey(nightKey())).split("-").map(Number);
    const d = new Date(y, m - 2, 1);
    state.month = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    render();
  },
  night(nk){ state.pickNight = state.pickNight === nk ? null : nk; render(); },
  dry(nk){
    if (isDry(nk)){
      const mark = state.log.filter(e => e.type === "dry" && e.night === nk).pop();
      if (mark) voidEvent(mark.id, "unmarked");
    } else log("dry", {night:nk});
    render();
  },
  radar(){ go("radar"); },
  radardrink(id){ state.radarDrink = id; render(); },
  report(id){ state.night = state.night || nightKey(); askPrice(id, 0); },
  shelf(){ go("shelf"); },
  sendreceipt(){ sendReceipt(); },
  setvenue(){
    const cur = nightVenue(state.night) || "";
    sheet(`<h2>Where are you?</h2>
      <p class="lede">It goes on the bill, and it is how the price radar knows which bar overcharged you.</p>
      <div class="search"><input id="venuein" type="text" value="${esc(cur)}" placeholder="Mama Cass, Surulere" autocomplete="off" aria-label="Venue"></div>
      <button class="btn" data-a="savevenue">Save</button>
      <button class="btn quiet" data-a="closesheet">Cancel</button>`);
    const el = document.getElementById("venuein");
    if (el) el.focus();
  },
  savevenue(){
    const el = document.getElementById("venuein");
    const name = el ? el.value.trim() : "";
    if (name) log("venue", {night:state.night, name});
    closeSheet(); render();
  },

  /* the tile. Tap adds one and the badge increments in place: no screen change,
     no confirmation, no re-render. That is the shopping-cart convention, so
     nobody has to learn it. */
  tile(id){
    const known = knownPrice(id, state.night);
    if (!known) return askPrice(id, 1);
    addRound(id, 1, known);
    bumpTile(id);
  },
  tilehold(id){ askQty(id); },
  /* press and hold the badge subtracts, which writes a void rather than editing
     the log, so the receipt can still say what was removed and when */
  unbadgehold(id){
    const mine = roundsOn(state.night).filter(e => e.drink === id);
    if (!mine.length) return;
    voidEvent(mine[mine.length - 1].id, "removed by hold");
    bumpTile(id);
    toast("Removed. It still shows on the bill.");
  },
  padkey(k){
    const p = state.pad;
    if (!p) return;
    if (k === "back") p.value = p.value.slice(0, -1);
    else if (p.value.length < 7) p.value += k;
    const el = document.getElementById("padval");
    if (el) el.textContent = p.mode === "price" ? (p.value ? naira(Number(p.value)) : "₦0") : (p.value || "0");
  },
  padok(){
    const p = state.pad;
    if (!p) return;
    const n = Number(p.value);
    if (!n){ toast("Put a number first."); return; }
    if (p.mode === "price"){
      if (p.qty > 0) addRound(p.id, p.qty, n);
      else log("price_report", {drink:p.id, price:n, night:state.night, area:nightVenue(state.night) || null});
    } else {
      const known = knownPrice(p.id, state.night);
      if (!known){
        state.pad = {id:p.id, qty:n, value:"", mode:"price"};
        return padSheet("How much is " + esc(shortName(BY[p.id])) + " here?", "Once tonight.");
      }
      addRound(p.id, n, known);
    }
    state.pad = null; closeSheet(); render();
  }
};

/* Tap to paint under 100ms from memory, write fire-and-forget. The badge is the
   whole interaction, so it never goes through render(). */
function bumpTile(id){
  const el = document.querySelector('.tile[data-v="' + id + '"]');
  if (!el) return render();
  const n = roundsOn(state.night).filter(e => e.drink === id).reduce((a, e) => a + e.qty, 0);
  let b = el.querySelector(".badge");
  if (!n){ if (b) b.remove(); }
  else if (b) b.textContent = n;
  else {
    b = document.createElement("i");
    b.className = "badge"; b.dataset.hold = "unbadge"; b.dataset.v = id;
    b.setAttribute("role", "status"); b.textContent = n;
    el.appendChild(b);
  }
  const t = document.querySelector(".total");
  if (t){
    const c = nightCount(state.night), first = roundsOn(state.night)[0];
    t.querySelector("b").textContent = naira(nightTotal(state.night));
    t.querySelector("em").textContent = (c ? c + " " + (c === 1 ? "round" : "rounds") : "Nothing yet")
      + (first ? ", since " + clock(first.ts) : "");
  }
}

/* Press and hold is undiscoverable, so it gets exactly one hint on first use
   and never again. */
let holdT = null, holdFired = false;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("[data-hold]");
  if (!el) return;
  holdFired = false;
  holdT = setTimeout(() => {
    holdFired = true;
    if (!state.holdHint){ state.holdHint = true; store.set("holdHint", 1); }
    const fn = actions[el.dataset.hold + "hold"];
    if (fn) fn(el.dataset.v, el);
  }, 500);
});
document.addEventListener("pointerup", e => {
  clearTimeout(holdT);
  const el = e.target.closest("[data-hold]");
  if (!el || holdFired) return;
  e.preventDefault();
  const fn = actions[el.dataset.hold];
  if (fn) fn(el.dataset.v, el);
});
document.addEventListener("pointercancel", () => clearTimeout(holdT));

async function sendReceipt(){
  const night = state.night, total = nightTotal(night), n = nightCount(night);
  const lines = roundsOn(night).map(e =>
    clock(e.ts) + "  " + (BY[e.drink] ? shortName(BY[e.drink]) : e.drink)
    + (e.qty > 1 ? " x" + e.qty : "") + "  " + (e.price ? naira(e.qty * e.price) : "-"));
  const text = nightLabel(night) + ". " + n + " " + (n === 1 ? "round" : "rounds") + ", " + naira(total) + ".\n"
    + lines.join("\n") + "\n" + shareUrl("");
  if (navigator.share){
    try { await navigator.share({text}); return; }
    catch(err){ if (err && err.name === "AbortError") return; report(new ShayoError("share.receipt", night, err)); }
  }
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(
    () => toast("Copied. Show them the times."),
    err => report(new ShayoError("copy.receipt", night, err), "Could not copy."));
}


function openDrink(id, from){
  if (!BY[id]) throw new ShayoError("open.unknown", id);
  const seen = state.seen[id] || 0;
  /* a second lookup of the same drink is the signal that the roasts have run out */
  if (seen > 0) log("repeat_lookup", {drink:id, times:seen + 1, roasts:roastList(BY[id]).length});
  state.seen[id] = seen + 1;
  store.set("seen", state.seen);
  state.drink = id; state.from = from || "feed";
  go("drink");
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const fn = actions[el.dataset.a];
  if (!fn) return;
  e.preventDefault();
  try { fn(el.dataset.v, el); }
  catch(err){ report(new ShayoError("action." + el.dataset.a, el.dataset.v || "", err), "That did not save. Try again."); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("sheet").hidden){ closeSheet(); return; }
  /* keyboard advance: the feed is a list, and a list you cannot page is not a list */
  if (state.screen !== "feed") return;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const step = {ArrowDown:1, PageDown:1, " ":1, ArrowUp:-1, PageUp:-1}[e.key];
  if (!step) return;
  const feed = document.getElementById("feed");
  if (!feed) return;
  e.preventDefault();
  feed.scrollBy({top:step * feed.clientHeight, behavior:"smooth"});
});

function boot(){
  state.mine = store.get("mine", {}) || {};
  state.seen = store.get("seen", {}) || {};
  state.log = store.get("log", []) || [];
  if (store.get("named")) state.named = true;
  if (store.get("coach")) state.coach = true;
  if (store.get("holdHint")) state.holdHint = true;
  state.night = nightKey();

  try {
    const h = decodeURIComponent((location.hash || "").slice(1));
    if (h.startsWith("d=") && BY[h.slice(2)]) state.pending = h.slice(2);
  } catch(e){ report(new ShayoError("boot.hash", location.hash, e)); }

  /* The gate is the entry, including the deep-link entry. Somebody forwarded a
     roast into a group chat; we do not know who opened it. */
  const adult = store.get("adult"), under = store.get("under");
  const refused = under && Date.now() - under < 864e5;
  buildOrder();
  if (refused) state.screen = "under";
  else if (adult && adult.ok){
    if (state.pending){ state.entry = "link"; state.coach = true; state.drink = state.pending; state.pending = null;
      state.seen[state.drink] = (state.seen[state.drink] || 0) + 1; state.screen = "drink"; state.from = "feed"; }
    else state.screen = "feed";
  } else state.screen = "gate";
  render();

  if (!store.available) toast("Private mode: nothing you claim tonight will be here tomorrow.", true);
  if ("serviceWorker" in navigator && /^https:/.test(location.protocol)){
    navigator.serviceWorker.register("sw.js").catch(e =>
      report(new ShayoError("sw.register", "service worker", e)));
  }
}
boot();
</script>
